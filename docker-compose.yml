version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend/.env:/app/backend/.env
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    command: sh -c "cd frontend && npm run dev"
    volumes:
      - ./frontend:/app/frontend
    restart: unless-stopped
